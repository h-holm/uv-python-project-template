version: 2

updates:
  # Maintain Docker dependencies.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      docker:
        patterns:
          - '*'
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'docker'

  # Maintain GitHub Actions dependencies.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      github-actions:
        patterns:
          - '*'
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'ci'

  # Maintain Python dependencies.
  - package-ecosystem: uv
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types:
          - 'patch'
          - 'minor'
      major:
        update-types:
          - 'major'
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'python'
