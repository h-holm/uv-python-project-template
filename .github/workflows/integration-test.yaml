name: Integration Test

on:
  # Run this workflow on any PR that is opened, reopened, or synchronized.
  pull_request:
    types: [opened, reopened, synchronize]

  # Run this workflow on any commit pushed to `main`. If the commit introduces a new version in the `pyproject.toml`, the
  # vetted image is released: the commit is tagged with the version and the image is deployed.
  push:
    branches: ['main']

# Only cancel superseded PR runs. Each `main` run must complete, as a cancelled run would skip the release of a new
# version. Using the unique run ID as the group effectively disables concurrency limits on `main`.
concurrency:
  group: "integration-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Check which file(s) were changed, in order to decide which jobs to run.
  paths-filter:
    uses: ./.github/workflows/paths-filter.yaml

  # Validate the version in the `pyproject.toml` against the released versions (the SemVer tags of the repository). The
  # version must either equal the latest released version, or be a new, higher version that is released once merged.
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}
      is-new-version: ${{ steps.check-version.outputs.is-new-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Version
        id: check-version
        run: |
          version=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' is not of the form <major>.<minor>.<patch>."
            exit 1
          fi
          latest=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [[ "$version" == "$latest" ]]; then
            is_new_version=false
          elif [[ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" == "$version" ]]; then
            is_new_version=true
          else
            echo "::error::Version '$version' is lower than the latest released version '$latest'."
            exit 1
          fi
          echo "Version: '$version'. Latest released version: '${latest:-none}'. New version: $is_new_version."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is-new-version=$is_new_version" >> "$GITHUB_OUTPUT"

  # Run the CodeQL Analysis workflow.
  codeql-analysis:
    name: CodeQL Analysis
    uses: ./.github/workflows/codeql-analysis.yaml
    needs: [paths-filter]
    if: needs.paths-filter.outputs.application-relevant-files-changed == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write

  # Build and push a container image to the GCP Artifact Registry.
  build-and-push-image:
    name: Build and Push Image
    uses: ./.github/workflows/build-and-push-image.yaml
    needs: [paths-filter]
    if: needs.paths-filter.outputs.application-relevant-files-changed == 'true'
    secrets: inherit
    permissions:
      contents: read
      id-token: write

    # Secrets set in a GitHub Environment do not trickle down to re-used workflows as desired. This is a workaround to
    # make the required secrets available to the `build-and-push-image` job when calling it from here.
    with:
      GITHUB_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prd' || 'stg' }}

  integration-test:
    name: Integration Test
    needs: [paths-filter, build-and-push-image]
    if: needs.paths-filter.outputs.application-relevant-files-changed == 'true'
    runs-on: ubuntu-latest

    # Target the "prd" GitHub environment for pushes to `main`, and "stg" for PRs.
    environment: ${{ github.ref == 'refs/heads/main' && 'prd' || 'stg' }}
    env:
      ARTIFACT_REGISTRY_HOSTNAME: "${{ secrets.GCP_LOCATION }}-docker.pkg.dev"
      ARTIFACT_REGISTRY_URL: "${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_NAME }}"
      CICD_SERVICE_ACCOUNT_EMAIL: "${{ vars.GCP_CICD_SERVICE_ACCOUNT_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
      RUNTIME_SERVICE_ACCOUNT_EMAIL: "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

    # The `gcp-auth` step requires these permissions to read and pass tokens.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Authenticate to Google Cloud via Workload Identity Federation (WIF).
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.CICD_SERVICE_ACCOUNT_EMAIL }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: access_token

      # Create a Cloud Run job. Make sure to `--wait` for the job to finish.
      - name: Run Cloud Run Job
        run: |-
          gcloud run jobs deploy "${{ github.event.repository.name }}-integration-test" \
            --image "${{ env.ARTIFACT_REGISTRY_HOSTNAME }}/${{ env.ARTIFACT_REGISTRY_URL }}/${{ github.event.repository.name }}:sha-${{ github.sha }}" \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT_EMAIL }}" \
            --max-retries 3 \
            --task-timeout 5m \
            --parallelism 1 \
            --region "${{ secrets.GCP_LOCATION }}" \
            --args="--log-level,debug,123" \
            --execute-now \
            --wait

  # On a push to `main`, tag the now-vetted image with `main`.
  promote-image:
    name: Promote Image
    uses: ./.github/workflows/promote-image.yaml
    needs: [integration-test]
    if: github.event_name == 'push' && needs.integration-test.result == 'success'
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      GITHUB_ENVIRONMENT: prd

  # If a vetted commit on `main` introduces a new version, tag the commit with the version. The tag is created before the
  # deployment, so that a version always refers to the same commit. If the deployment fails, re-run the failed jobs.
  create-tag:
    name: Create Tag
    needs: [check-version, integration-test]
    if: >-
      github.event_name == 'push'
      && needs.check-version.outputs.is-new-version == 'true'
      && needs.integration-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Tag
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.VERSION}`,
              sha: context.sha,
            });

  # Deploy the vetted image of the new version. Note that a tag created via the `GITHUB_TOKEN` does not trigger other
  # workflows, which is why the deployment workflow is called directly.
  deploy:
    name: Deploy
    uses: ./.github/workflows/deploy-to-cloud-run.yaml
    needs: [check-version, create-tag]
    secrets: inherit
    permissions:
      contents: write
      id-token: write
    with:
      VERSION: ${{ needs.check-version.outputs.version }}
