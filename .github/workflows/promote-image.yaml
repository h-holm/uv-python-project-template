name: Promote Image

on:
  workflow_call:
    inputs:
      GITHUB_ENVIRONMENT:
        description: "The GitHub environment to use"
        type: string
        required: true
      VERSION:
        description: "The released version (if any) to tag the image with"
        type: string
        required: false
        default: ""

defaults:
  run:
    shell: bash

# After an already-pushed image (tagged `sha-<sha>`) has been confirmed to work, supplement the image with additional
# tags: the branch name (i.e., `main`) or, if a version is given, the SemVer tags (`<major>.<minor>.<patch>`,
# `<major>.<minor>`, `<major>`) and `latest`.
jobs:
  promote-image:
    name: Promote Image
    runs-on: ubuntu-latest
    environment: ${{ inputs.GITHUB_ENVIRONMENT }}
    env:
      ARTIFACT_REGISTRY_HOSTNAME: "${{ secrets.GCP_LOCATION }}-docker.pkg.dev"
      ARTIFACT_REGISTRY_URL: "${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_NAME }}"
      CICD_SERVICE_ACCOUNT_EMAIL: "${{ vars.GCP_CICD_SERVICE_ACCOUNT_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
      REPO_NAME: ${{ github.event.repository.name }}

    # The "Authenticate to Google Cloud" step requires these permissions to read and pass tokens.
    permissions:
      contents: read
      id-token: write

    steps:
      # Authenticate to Google Cloud via Workload Identity Federation (WIF).
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.CICD_SERVICE_ACCOUNT_EMAIL }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: access_token

      # Concurrent `main` runs can finish out of order. To prevent an older run from moving the `main` tag back to its
      # commit, only apply the branch name tag if the commit is still the tip of `main`.
      - name: Check if Commit is Tip of main
        id: main-tip
        if: inputs.VERSION == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "is-main-tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not tagging the image with 'main', as ${GITHUB_SHA} is no longer the tip of main (${tip})."
            echo "is-main-tip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ARTIFACT_REGISTRY_HOSTNAME }}/${{ env.ARTIFACT_REGISTRY_URL }}/${{ env.REPO_NAME }}
          # Apply `latest` explicitly (only) alongside the SemVer tags.
          flavor: latest=false
          tags: |-
            type=ref,event=branch,enable=${{ inputs.VERSION == '' && steps.main-tip.outputs.is-main-tip == 'true' }}
            type=semver,pattern={{version}},value=${{ inputs.VERSION }},enable=${{ inputs.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.VERSION }},enable=${{ inputs.VERSION != '' }}
            type=semver,pattern={{major}},value=${{ inputs.VERSION }},enable=${{ inputs.VERSION != '' }}
            type=raw,value=latest,enable=${{ inputs.VERSION != '' }}

      - name: Add Tags to Image
        # Loop over the tags generated by the "Generate Tags" step and add them to the image in the registry.
        env:
          IMAGE: ${{ env.ARTIFACT_REGISTRY_HOSTNAME }}/${{ env.ARTIFACT_REGISTRY_URL }}/${{ env.REPO_NAME }}
        run: |-
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            echo "Adding '$tag' tag to image..."
            gcloud artifacts docker tags add "${IMAGE}:sha-${GITHUB_SHA}" "$tag"
          done
