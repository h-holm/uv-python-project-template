name: Deploy to Cloud Run

on:
  # Called by the `ci-cd.yaml` workflow when a vetted commit on `main` introduces a new version. No image is
  # built here: the image built and vetted earlier in the calling workflow run is deployed.
  workflow_call:
    inputs:
      VERSION:
        description: "The new version to deploy and release"
        type: string
        required: true

  # Allow redeploying an already-released version manually, e.g., to roll back to a previous version.
  workflow_dispatch:
    inputs:
      VERSION:
        description: "The already-released version to redeploy (e.g., 0.5.2)"
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  deploy-cloud-run-job:
    name: Deploy Cloud Run Job
    runs-on: ubuntu-latest
    environment: prd

    # Never run two deployments at once, and never cancel an in-progress deployment.
    concurrency:
      group: deploy-to-cloud-run-prd
      cancel-in-progress: false

    outputs:
      is-latest-version: ${{ steps.check-version.outputs.is-latest-version }}

    env:
      ARTIFACT_REGISTRY_HOSTNAME: "${{ secrets.GCP_LOCATION }}-docker.pkg.dev"
      ARTIFACT_REGISTRY_URL: "${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_NAME }}"
      CICD_SERVICE_ACCOUNT_EMAIL: "${{ vars.GCP_CICD_SERVICE_ACCOUNT_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
      RUNTIME_SERVICE_ACCOUNT_EMAIL: "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
      # Use a shorter variable name as this is referenced multiple times.
      REPO_NAME: ${{ github.event.repository.name }}
      VERSION: ${{ inputs.VERSION }}

    # The `gcp-auth` step requires these permissions to read and pass tokens.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # A manual redeployment requires the version to be released already. A new version is only deployed if no higher
      # version has been released in the meantime, e.g., by a later `main` run that finished first.
      - name: Check Version
        id: check-version
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::Version '${VERSION}' has not been released."
            exit 1
          fi
          latest=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [[ "$VERSION" == "$latest" ]]; then
            echo "is-latest-version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-latest-version=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::notice::Skipping the deployment of '${VERSION}', as the higher version '${latest}' exists."
            fi
          fi

      # Authenticate to Google Cloud via Workload Identity Federation (WIF).
      - name: Authenticate to Google Cloud
        id: gcp-auth
        if: github.event_name == 'workflow_dispatch' || steps.check-version.outputs.is-latest-version == 'true'
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.CICD_SERVICE_ACCOUNT_EMAIL }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: access_token

      # Create (or update if one already exists) a Cloud Run job. On a manual redeployment, use the image tagged with
      # the released version. Otherwise, use the image built and vetted earlier in the calling workflow run. Attach a
      # service account (SA) to the Cloud Run job that has the necessary privileges for running the application logic.
      # Note that this "runtime SA" is different from the "CI/CD SA" used to run this GitHub Actions workflow. Make sure
      # to `--execute-now` and `--wait` for the job to finish, so that the CI job fails in case the job fails.
      - name: Deploy Cloud Run Job
        if: steps.gcp-auth.outcome == 'success'
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.VERSION || format('sha-{0}', github.sha) }}
        run: |-
          gcloud run jobs deploy "${{ env.REPO_NAME }}" \
            --image "${{ env.ARTIFACT_REGISTRY_HOSTNAME }}/${{ env.ARTIFACT_REGISTRY_URL }}/${{ env.REPO_NAME }}:${IMAGE_TAG}" \
            --max-retries 3 \
            --task-timeout "10m" \
            --parallelism 1 \
            --region "${{ secrets.GCP_LOCATION }}" \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT_EMAIL }}" \
            --args="--log-level,debug,200" \
            --execute-now \
            --wait

  # After a successful deployment of a new version, tag the deployed image with the version and `latest`.
  promote-image:
    name: Promote Image
    uses: ./.github/workflows/promote-image.yaml
    needs: [deploy-cloud-run-job]
    if: github.event_name != 'workflow_dispatch' && needs.deploy-cloud-run-job.outputs.is-latest-version == 'true'
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      GITHUB_ENVIRONMENT: prd
      VERSION: ${{ inputs.VERSION }}

  # Create a GitHub Release for the new version, with release notes listing the PRs merged since the previous release.
  # A version whose deployment was skipped (as a higher version exists) is still released, but not marked as latest.
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-cloud-run-job, promote-image]
    if: >-
      !cancelled()
      && github.event_name != 'workflow_dispatch'
      && needs.deploy-cloud-run-job.result == 'success'
      && needs.promote-image.result != 'failure'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ inputs.VERSION }}
          IS_LATEST_VERSION: ${{ needs.deploy-cloud-run-job.outputs.is-latest-version }}
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.VERSION,
              name: `Release ${process.env.VERSION}`,
              generate_release_notes: true,
              make_latest: process.env.IS_LATEST_VERSION,
            });
